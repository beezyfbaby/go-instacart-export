version: 2
before:
  hooks:
    - go mod tidy
    - go test ./...
builds:
  - main: ./cmd/instacart-export
    binary: instacart-export
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ .Version }}-next'
changelog:
  sort: asc
release:
  extra_files:
    - glob: ./LICENSE
signs:
  - artifacts: checksum
